name: Dependency Security

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high || true
